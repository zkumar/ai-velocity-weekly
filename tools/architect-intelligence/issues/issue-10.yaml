  label: MODELS PRICED
one_line: 'Last week the record thinned: a log, a checkpoint stream and a federal rule each stopped carrying something. This week the gate showed its edges: a write on neither approval list ran unasked, a guard that crashed let its tool through, and most of the fixes that shipped are settings somebody still has to turn on.'
pillars:
- name: UNLISTED
  text: An approval policy is two lists of tool names, and the server adds a third write. Does the framework ask, and does the version you have installed read the setting that makes it ask? Slide 08, then 04.
- name: FAILED
  text: A guard in front of a write raises an exception, or a toolset's approval flag misses one tool object. Does the action wait, or does a failure count as no opinion and go through? Slides 04 and 08.
- name: ANSWERED
  text: An approval arrives twice, or late, or from a review mode that is not a person. Is it checked against a question that is still open, and does your own record say who gave it? Slides 05 and 10.

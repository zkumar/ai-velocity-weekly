theme:
  label: THE WEEK'S THEME
  title: THE TOOL NOBODY LISTED
  text: 'Issue 09 read what a log and a checkpoint stream stopped carrying about an action. This week the subject is the approval gate at its edges: what a policy does with a tool it does not name, what a guard does when it fails, and what a paused run does with an answer it is no longer waiting for.'

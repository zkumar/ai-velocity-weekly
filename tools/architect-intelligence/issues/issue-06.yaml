sections:
- key: approval
  num: '04'
  label: WHAT RUNS BEFORE THE ANSWER
  title: The Write That Went First, the Tool That Ran and Threw, the Stamp
  intro: Two executed with scripted clients, one read from the changelog and the installed wheel. The LangGraph gate is executed on slide 08.
  accent: 0EA5E9
  items:
  - kicker: MICROSOFT · AGENT FRAMEWORK 1.21.0
    tag: EXECUTED
    headline: A question for the clinician and a medication hold in one response, and the hold is written first
    body: 'PR #9050. A model response carrying a host-answered tool and a local write used to pause as a whole and the write never ran. On 1.21.0 the batch is split. Without a session the hold was in the record before the clinician saw the question. With a session it waited under deferred_function_calls, then ran after the clinician answered "No. Do not hold".'
    changed: The human no longer sees the write as a request. A session orders it after the answer; nothing makes it depend on the answer.
    change: Pass a session on every path, and never let a write that depends on a clinician's reply share a response with the question. Put it in a later turn behind its own approval.
    link: lab
  - kicker: OPENAI · AGENTS SDK FOR JAVASCRIPT 0.19.0 AND 0.20.0
    tag: EXECUTED
    headline: Approved, executed once, then MaxTurnsExceededError with no hint that a write happened
    body: '#2032 in 0.20.0 counts the model call after an approval resume against maxTurns: with a budget of 1 the discharge tool ran, then the resume threw. 0.19.0, read from the changelog, moves RunState to schema 1.21, re-evaluates the approval policy on a durable resume instead of trusting the stored decision, and rejects checkpoints without a guardrail marker, which is every older snapshot past turn zero.'
    changed: '"The tool ran and the run failed" is an ordinary outcome of a tight budget, and some paused runs from before the upgrade will not restore.'
    change: Catch the turn-budget exception on resume and reconcile against the record before reporting failure. Count the paused runs you hold before upgrading past 0.19.0.
    link: lab
  - kicker: GOOGLE · ADK 2.11.0 AND ADK-JS 2.2.1
    tag: DOCS
    headline: An HMAC stamp on every function call, verified before the tool runs, except for workflow nodes
    body: ToolCallIntegrityPlugin(secret_key, allow_unstamped_calls=False) stamps each call into custom_metadata over app, user, session, invocation, branch, author, name, id and arguments; before_tool_callback refuses any call without a valid stamp with ToolCallIntegrityError. Tools run as workflow nodes are not checked. A call aborted through the new abort_signal is sealed with error_code INVOCATION_ABORTED and not replayed on resume.
    changed: The call that runs is provably the call the model emitted, under a key you hold. It does not sign what the reviewer saw, and the confirmation flow lives in the nodes it skips.
    change: Turn it on, keep the key out of session state, store the stamp in the approval row, and cover workflow-node tools yourself.
    link: longform
  signal: Ordering is not consent. A framework can promise that the write runs after the answer; whether the answer permits it is still a decision only your gate records.
- key: surface
  num: '05'
  label: WHAT THE CALLER IS TOLD
  title: An Error With a Row Behind It, and an Audit Hook a Cache Can Skip
  intro: Two executed, one read from a wheel diff. In each the report and the event came apart.
  accent: 00B4A0
  items:
  - kicker: FASTMCP 4.1.0
    tag: EXECUTED
    headline: is_error=True, "timed out after 0.2s", and one order in the record
    body: 'PR #5379. A synchronous tool with timeout=0.2 took one second and wrote an order. 4.0.11 returned success and "ORDER PLACED". 4.1.0 rejects the late result and returns an error. The row was written on both. The same release expires idle HTTP sessions after 30 minutes by default (#5229) and re-scopes MultiAuth client ids, so tasks pending across the upgrade change owner (#5455).'
    changed: The timeout is now honoured in the report and not in the world, and an agent that sees an error retries.
    change: Treat a timeout on a write tool as outcome unknown and look the write up by idempotency key before any retry. Set the idle timeout above your longest human approval.
    link: lab
  - kicker: PYDANTIC-AI 2.54.0
    tag: EXECUTED
    headline: before and after hooks moved inside the wrapper, and a cache hit ran neither
    body: 'PR #7053. An audit capability counted requests in before_model_request and after_model_request and also wrapped the request. When the wrapper answered from a cache without calling the handler, 2.53.0 still ran both hooks; 2.54.0 ran neither, and the pull request says a skipped provider call records no usage and no span attributes. 2.53.0 also carries GHSA-6fqq-452j-qhrp, a concurrency-slot leak on streamed requests from 2.10.0.'
    changed: A cache or a guard written as a wrapper now removes whatever the inner hooks were doing, including redaction and authorisation.
    change: Put mandatory checks in the outermost wrapper or outside the agent, and add a test that a short-circuited request still writes the audit row.
    link: lab
  - kicker: LANGCHAIN 1.4.4
    tag: DOCS
    headline: The summariser overflows, retries once with the middle omitted, and logs it at DEBUG
    body: 'PR #41159, read from the wheel. SummarizationMiddleware used to re-send the same prompt three times after a ContextOverflowError. It now retries once with the head and tail and the marker "[... middle of conversation omitted ...]", budgeted at half the tokens and capped at 40% of max_input_tokens. langchain-core 1.6.8 (#41151) also hardens the SSRF policy for IPv6-mapped localhost and metadata addresses under a relaxed policy.'
    changed: A summary can be missing the middle of a chart review with nothing at the default log level to say so.
    change: Raise that logger for clinical agents, or wrap the middleware and record when the fallback fired beside the summary it produced.
    link: longform
  signal: Error, timeout and exception are statements about the call. None is a statement about the record, and a retry policy that reads them as one writes the second row.
- key: models
  num: '06'
  label: MODELS ON ONE WORKLOAD
  title: A Price Cliff at 100,000 Tokens and Two $130 Rows Now Identical
  intro: 4,000 input and 500 output tokens per document, list prices read 9 October. Artificial Analysis is still v4.3.2; its healthcare index page did not load, so no medical score is quoted this week.
  accent: F59E0B
  items:
  - kicker: ANTHROPIC · CLAUDE HAIKU 5.5, NEW 7 OCT
    headline: Haiku 5.5 does the workload for $6.50 and reads 43, until the prompt passes 100,000 tokens
    body: '$0.10 in, $0.50 out, $0.01 cached: the same as GPT-6 Luna to the cent, and five index points above it. A request whose prompt exceeds 100,000 tokens pays 0.50, 2.50 and 0.05 on the whole request, cache hits included, so the same token volume costs $32.50. Anthropic''s "90% cheaper than Haiku 4.5"* matches the list prices; its 39.2% on Terminal-Bench 4.0* is its own.'
    changed: The cheapest tier now has a price cliff set by prompt length, and long-context chart review sits on the wrong side of it.
    change: Measure your prompt-length distribution before you budget, and route requests over the threshold deliberately.
    link: longform
  - kicker: ANTHROPIC · CLAUDE SONNET 5.5 AND OPENAI · GPT-6.1 SOL
    headline: Sonnet 5.5's cache read halved to $0.10, so the two $130 rows match in both columns
    body: 'Sonnet 5.5, released 28 September, had its cache read cut from $0.20 to $0.10 on 7 October, matching GPT-6.1 Sol: $130 uncached and $69.20 with 80% of input cached for both. They read 56 and 52; Opus 5.5 is 58 at $260. gpt-6-sol, released 22 September, has already left OpenAI''s price page. Mistral Large 4 arrived in preview at list $75.30 and a two-week half price; Kimi K3 enters the table at $195 and 44.'
    changed: The second tier sits two index points under the first at half the price, and a three-week-old model id is already gone from the price list.
    change: Record the model id, the date read and the cache rate in the validation file, and re-run validation when you move tiers.
    link: longform
  signal: A price that depends on prompt length makes context size a cost decision per request. The router that decides it needs the same audit as the model it routes to.
- key: papers
  num: '07'
  label: PAPERS TO IMPLEMENTATION
  title: The Altered Call, the Gate That Refused Everything, the Payer Benchmark
  intro: Three results on the distance between the call the model wrote and the call that ran. Numbers are the authors' own, from the abstracts.
  accent: A78BFA
  items:
  - kicker: INTENT-EXECUTION CORRESPONDENCE · 2610.04375
    headline: 12% of shell calls carrying code or escapes were altered on the way to execution, 80.7% of those ran the wrong action silently
    body: 47,828 production shell calls. One agent's shell tool altered 12.0% of calls that carried code, escapes or long text; 80.7% of the calls altered by backslash handling ran the wrong action with no error. All ten harnesses tested altered at least one call. The authors' repair recovers 79.2%, measured on their own product*.
    changed: The transcript records what the model emitted. What executed can differ, and nothing raises.
    change: Log the call as received at every hop, model, harness, wrapper and tool, and diff the hops.
    link: longform
  - kicker: NOMOS · 2610.11030
    headline: Policy compiled into gates cut violations from 66.3% to 2.6%, and one development gate refused 95.9% of valid calls
    body: Natural-language policy compiled into deterministic tool-call gates on two agent benchmarks; violations among state-changing calls fell from 66.3% to 2.6% in one domain and 30.8% to 6.9% in another. A development binding wrongly refused almost every valid call until the gates were replayed over past transcripts.
    changed: Policy enforcement outside the model works, and an untested gate fails in the direction that looks safe.
    change: Replay every new gate over recorded traffic before it ships, and report false refusals beside violations.
    link: longform
  - kicker: CHI-BENCH · 2605.16679, V3 30 SEPT
    headline: 87 MCP tools, 20 simulated healthcare apps, and the best configuration resolves 28% of prior-auth and UM tasks
    body: Prior authorisation, utilisation management and care management with a 1,290-document handbook. No configuration of 30 clears 20% when a task must pass three times in three, and running all tasks in one session drops the best to 3.8%. A separate Northwestern study (2610.05778) attributes about a quarter of outcome variance to the harness and its interaction with the model.
    changed: A long-horizon payer benchmark exists, and session reuse is its single largest failure factor.
    change: One case per session, gate on pass-every-repeat, and re-validate when the harness changes, not only when the model does.
    link: longform
  signal: Five harness releases in one week each changed what a paused run does. A validation result belongs to a model and a harness version together, and this week the harness half expired.
mechanism:
  num: 08
  label: MECHANISM OF THE WEEK
  title: The answered question that stayed open
  kicker: LANGGRAPH 1.2.13 · NO MODEL, 1.2.12 AGAINST 1.2.13, SQLITE CHECKPOINTER FOR THE UPGRADE RUN
  body: Two parallel approval gates, pharmacy and physician; each calls interrupt(), signs the order and returns no state. The pharmacist answers by id. On 1.2.12 the thread still listed both questions, a second reviewer's rejection was accepted and discarded, and the pharmacy gate signed again on that resume and again when the physician answered. On 1.2.13 one question remained and each gate ran once. A thread paused on 1.2.12 and opened on 1.2.13 signed twice. Gates returning a state key wrote two rows on both.
  stats:
  - n: 4 → 2
    label: SIGNATURE ROWS FOR 2 APPROVALS, 1.2.12 TO 1.2.13
  - n: 2 → 1
    label: INBOX ITEMS AFTER ONE OF TWO ANSWERS
  - n: '3'
    label: ROWS WHEN A THREAD PAUSED BEFORE THE UPGRADE FINISHED AFTER IT
  changed: 'PR #9103 gives the paused thread one reader of task status and marks a finished gate with no output as finished. Its docstring says older writes "read as unfinished" and the executor "runs them again". A resume addressed to an already-answered interrupt id is still accepted silently on both versions.'
  move: Build the inbox from your own table of asked and answered interrupt ids and refuse a second answer yourself. Give every gate an idempotency key before upgrading, and drain paused threads first. Search the record for duplicate writes from any node that follows an interrupt and returns nothing. test_lg_pending_interrupts.py runs all of it in seconds.
  link: lab
  signal: A fix that changes how a checkpoint is read does not rewrite the checkpoints already stored. Every approval in flight on upgrade day runs on the old rules.
shipped:
  num: 09
  label: WHAT THE ARCHITECTS SHIPPED
  title: Technical output only, no job moves
  items:
  - who: ASTP/ONC AND MEDSTAR
    text: 'A 2026 LEAP in Health IT award for open-source agent middleware titled "Sovereign Execution: Vigilant, Gated and Verifiable Agentic Care": durable long-running processes, patient-gated data pods on the Solid protocol, tamper-evident certificates for AI routing. Two awards, $1.5M in total; no FHIR or MCP binding named.'
  - who: OPENAI
    text: In-product BAA acceptance and a HIPAA compliance setting under organisation settings (5 Oct), a Decisions API beta on gpt-6-luna (6 Oct), and a builder's guide to GPT-6 covering effort, cache-friendly prompt order, compaction and cost per successful task; its numbers are OpenAI's and its customers'*.
  - who: ANTHROPIC
    text: A Usage Policy effective 12 November that keeps a qualified human in the loop and AI disclosure for health-affecting uses; Managed Agents web_fetch restricted to URLs already seen in the session, with allowed_hosts on both web tools; SDK 1.12.0 browser and computer toolsets gated by a confirm callable that declines on any exception.
  - who: ANACONDA
    text: Anaconda MCP at general availability, remote and read-only with four tools, with advice to remove the beta local package; and a guide to indirect prompt injection that puts human approval at an MCP gateway. The 73% figure for vulnerable MCP servers comes from a company Anaconda owns*. Read from the blog; the emailed edition could not be opened.
  - who: HL7 AND ARPA-H
    text: HL7's 2026 AI Challenge winners from 73 submissions, an MCP server for health information exchange among them, with showcases on 14 and 28 October; no Da Vinci, US Core or CDS Hooks publication in window. ARPA-H's SURPASS solicitation (30 Sept) asks for an "agentic operations layer" for trial start-up and dataset construction, summaries due 30 November.
  quiet: Nothing in window from Epic, FDA on AI, OCR, the MCP specification, Moonshot or NVIDIA beyond a startup profile. Mistral Large 4 and Matt Pocock's Skills v1.3 are in the long-form edition. Nebius announced the Inferize acquisition on 1 October with no user-facing change. The editor's newsletter inbox was not readable this run; the vendors' public pages were read instead.
  signal: A federal grant title now reads gated and verifiable. When funders adopt the vocabulary, the reference implementation they pay for becomes what an auditor expects to see.
constraints:
  num: '10'
  label: CONSTRAINTS AND RADAR
  title: A Rule With File Formats and a Deadline With No New Notice
  items:
  - kicker: CMS, TREASURY, LABOR · CMS-9882-F, 91 FR 63748, EFFECTIVE 7 DEC
    headline: 'Transparency in Coverage is final: one rate file per provider network, two new files, an attestation and a named official on each'
    body: Published 6 October. In-network files move to one per provider network; taxonomy and utilisation files are new; cadence goes from monthly to quarterly; each file carries an attestation and a named senior official. CMS intends to specify JSON in later guidance; no schema is published. No AI, FHIR or prior-authorisation content.
    move: If an agent assembles or checks these files, the attestation makes its output a signed statement. Decide now who reviews it and what evidence of that review you keep.
  - kicker: CMS-0057-F · ARPA-H SURPASS SOL-26-164 · FDA-2026-N-7874
    headline: Twelve weeks to the prior authorisation APIs with no new notice, and two dates for agents that act on records
    body: The CMS-0057-F page, modified 8 October, still says API requirements are due "primarily" 1 January 2027; the February 2024 enforcement discretion is the only posted notice. ARPA-H wants solution summaries for an agentic trial-operations layer by 30 November. FDA's generative-AI device discussion paper takes comments until 19 October and FDA published nothing on AI in window.
    move: Freeze the agent framework versions behind your prior authorisation API before January, with this week's upgrade notes read. If you propose to ARPA-H, specify the evidence the operations layer leaves.
  radar:
    text: Every dated source for this week is in the long-form edition. The cumulative Radar was not refreshed this week.
    link: radar
  signal: A compliance date twelve weeks out turns every framework upgrade between now and then into a change to a regulated interface. Schedule them, or stop taking them.
close:
  text: Full mechanism, code and sources for every card are in the long-form edition. The architect's position on this week's decision is in My Take. The code runs from a clean virtual environment with no API key.

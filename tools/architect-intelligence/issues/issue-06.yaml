theme:
  label: THE WEEK'S THEME
  title: WHILE IT WAITS
  text: 'Issue 05 followed the yes to the agent it belongs to and the store it waits in. This week the waiting itself: a run that has asked a person and not yet heard back is neither working nor done, and five frameworks changed what that state reports, what it has already done, and what the caller is told afterwards.'

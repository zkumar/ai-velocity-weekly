- n: '14'
  label: MODELS PRICED
one_line: 'Last week the yes travelled between agents and stores. This week the pause itself was the problem: a thread kept listing an answered question as open, one pharmacist''s approval became three signatures, and a hold was written before the question sent with it was answered.'
pillars:
- name: OPEN
  text: One of two reviewers has answered. Does the inbox you build from the framework's pending list still show the answered question, and what happens to the record when a second reviewer answers it? Slide 08.
- name: DONE
  text: A write arrived in the same model response as a question for a clinician. Has it run by the time the clinician sees the question, does a session change that, and does the answer change it? Slide 04.
- name: TOLD
  text: A timeout, an exception after an approved tool, and a cache hit that skipped the audit hook. Which of these describes the record, and which only describes the call? Slides 04 and 05.

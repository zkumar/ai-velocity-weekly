one_line: Last week the signature moved. This week a clock, a server-side policy and a token audience can each answer before the clinician does, and the audit trail did not follow any of them.
pillars:
- name: DEADLINE
  text: If the loop has a time budget and the clinician is slower than it, who finds out? Slide 04.
- name: REACH
  text: One token, two servers. Which one should refuse it, and what does a resumed node do twice? Slides 05 and 08.
- name: DRIFT
  text: The configuration you validated is a hash the vendor can now compare for you. Who reads the answer? Slide 05.

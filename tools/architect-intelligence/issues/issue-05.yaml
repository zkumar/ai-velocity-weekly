one_line: 'Last week an approved write ran zero times or twice. This week the yes itself travelled: an "always" given for one agent''s saline flush covered another agent''s warfarin, and a request nobody issued was approved from a transcript.'
pillars:
- name: OWNER
  text: A reviewer said always to one agent's tool and the run handed off. Whose calls does that answer cover now, and does the key it is stored under contain anything the reviewer read? Slide 08.
- name: CUSTODY
  text: The pending request sat in the message history a client sends back. Who can write to the place your approvals wait, and what happens to a resume that arrives without it? Slide 04.
- name: IDENTITY
  text: Two calls under one id, and a tool absent from the list that still answered to its name. What does your audit join on, and have you checked it is unique? Slides 04 and 05.

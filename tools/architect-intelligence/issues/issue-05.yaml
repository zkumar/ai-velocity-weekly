theme:
  label: THE WEEK'S THEME
  title: THE REACH OF A YES
  text: 'Issue 04 counted how many times an approved write runs. This week four frameworks changed the key and the store behind the approval itself: which agent a yes belongs to, where the pending request is kept, and which call id it is matched to.'

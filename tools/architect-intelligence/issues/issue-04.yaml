one_line: Last week the yes was bound to arguments. This week a reviewer approved two writes and one ran zero times, a failing write ran twice, and a vendor put in writing that recovery is not exactly-once.
pillars:
- name: COUNT
  text: Two approvals, one success result, one row in the record. Which of the three does your reconciliation read, and which one does the model report? Slides 04 and 08.
- name: REPLAY
  text: A retry the caller never saw and a recovery the vendor will not call exactly-once. What makes the second execution a no-op instead of a second order? Slides 04 and 09.
- name: LEAKAGE
  text: A client secret in the session table, a token in the compaction prompt, a patient id on the tracer the policy did not govern. What did the trace carry that you had switched off? Slide 05.

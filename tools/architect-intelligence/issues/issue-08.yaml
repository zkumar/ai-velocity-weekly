  label: RUNS OF THE EXECUTED MECHANISM
- n: '12'
  label: PAPERS READ
- n: '15'
  label: MODELS PRICED
one_line: 'Last week a batch failed and the write that finished was dropped from the history. This week the pharmacist''s gate sat inside a child agent: the parent was handed an empty string, told the clinician the order was placed, and no request to approve it ever left the tool.'
pillars:
- name: DELEGATE
  text: A child agent stops for a person while running as its parent's tool. What is the parent handed in that moment, is the person's request reachable from the caller, and does the answer, when it comes, return to the agent that delegated? Slide 08, then 04.
- name: RELEASE
  text: Answers to approvals arrive on separate resumes and are released together. Which store records each result, under whose authorization scope, and how many times does a resumed answer's update get applied? Slide 05.
- name: LEDGER
  text: A write into a nested piece of state, a summary that flattened who said what, and a per-call gate that cannot see two calls together. What can the persisted record prove about an action, and who wrote each line of it? Slides 08 and 07.

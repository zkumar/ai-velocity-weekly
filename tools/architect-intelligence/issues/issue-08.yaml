theme:
  label: THE WEEK'S THEME
  title: THE GATE INSIDE THE TOOL
  text: 'Issue 07 read what the history keeps when one call in a batch fails. This week the unit became the delegate: an agent wrapped as another agent''s tool, what the layer above receives when the child stops for a person, and whether the person it stopped for can be reached from there at all.'

sections:
- key: approval
  num: '04'
  label: THE APPROVAL STEP
  title: What an Approval Is Attached To
  intro: One executed, two read from source. The OpenAI Agents SDK change is executed on slide 08.
  accent: 0EA5E9
  items:
  - kicker: LANGCHAIN 1.4.2
    tag: EXECUTED
    headline: A pharmacist cuts 1000 mg to 500 mg and the transcript still says 1000
    body: Edits no longer rewrite the AIMessage. The executed call lives in a private checkpoint key, hitl_edited_tool_calls, and a notice on the ToolMessage. On 1.4.1 transcript and tool agreed; on 1.4.2 they do not, and with edit_notice=None the key is the only record.
    changed: The model's proposal is now preserved, which is right for review. Any exporter reading AIMessage.tool_calls as what ran is now wrong.
    change: Write the audit row from the checkpoint key and the ToolMessage name, never the AIMessage. Keep the notice on. test_lc_hitl_edit.py runs both versions.
    link: lab
  - kicker: MICROSOFT · AGENT FRAMEWORK 1.19.0
    tag: DOCS
    headline: A middleware that repairs an approved argument voids the approval
    body: Approval binds to the normalised arguments with a float-bit-exact comparison. A changed approval-bound call executes zero times and yields a replacement request with a fresh generation id. A user turn now delimits stateless approval batches, and .NET rejects approvals it did not itself record.
    changed: The strongest statement this week that the signed arguments and the executed arguments must be the same object.
    change: Put argument-repair middleware before policy middleware, as the spec requires, and treat a replacement request as a second signature event in the transcript.
    link: longform
  - kicker: MCP SPEC · SEP-2640 SKILLS, FINAL
    tag: DOCS
    headline: An approval is revoked when the approved content's digest changes
    body: The skills extension says a persisted approval MUST be bound to the resource set and digests observed at approval, and MUST be treated as revoked and re-prompted when they change. It also says the allowed-tools field MUST be ignored for server-origin skills unless the user approved it.
    changed: The first normative MCP text that ties a remembered yes to what was shown, not to a name.
    change: Key cached tool approvals on a hash of name, description and input schema. Re-prompt on any change.
    link: longform
  signal: Three vendors answered the binding question three ways in one week. Pick the strictest one for your write tools and make it the tested contract.
- key: export
  num: '05'
  label: WHAT LEAVES THE PROCESS
  title: Two Settings That Were Quietly Ignored
  intro: Both read from source and changelog, neither executed. Each was a control you had switched on that did not hold.
  accent: 00B4A0
  items:
  - kicker: PYDANTIC-AI 2.44.0
    tag: DOCS
    headline: include_content=False could still export instructions to your traces
    body: A FallbackModel refresh treated an unset policy as permission to export, and streamed consumers lost the policy entirely. The fix fails closed per span, and unserialisable request parameters are now dropped instead of exported as a string.
    changed: Instruction text carrying PHI could reach an OTel collector configured not to receive it.
    change: Upgrade, then search spans from FallbackModel and streamed runs since you enabled redaction. A leak you cannot bound is a breach assessment, not a bug ticket.
    link: longform
  - kicker: FASTMCP 4.0.4 AND 4.0.5
    tag: DOCS
    headline: A StrictInt dose field accepted the string "5" since the SDK v2 migration
    body: The server's lax default overrode Field(strict=True), StrictInt and strict model configs on direct calls and task submission. 4.0.5 restores them. 4.0.4 stops logging argument values in validation warnings and rejects ID-JAG tokens when identity assertion is off.
    changed: A strict schema is part of a validated tool contract, and for weeks it was a suggestion.
    change: Add a test that "42" is rejected for every strict field on every write tool, and alert on the new ID-JAG rejection warning.
    link: longform
  signal: A control that is configured but not enforced produces a clean audit trail. Only a test that tries to break it tells you which you have.
- key: models
  num: '06'
  label: MODELS ON ONE WORKLOAD
  title: A Correction and a Cheaper Floor
  intro: 4,000 input and 500 output tokens per document, list prices read 20 September. Artificial Analysis stayed on v4.3, so scores compare with Issue 02.
  accent: F59E0B
  items:
  - kicker: CORRECTION · GPT-5.6 SOL
    headline: Sol does the job for $260, not the $350 Issue 02 printed
    body: The pricing page lists $4 in, $20 out, $0.40 cached, promotional until at least 21 November. Issue 02 said the promotion had ended at $5/$30; it had not. AA v4.3 score 47, unchanged.
    changed: Sol sits $65 under Opus 5 for the workload, four points lower on the index, with an end date on the price.
    change: If you moved a workload off Sol on last week's number, reverse it only with the November expiry written into the budget.
    link: longform
  - kicker: OPEN WEIGHTS · MIT
    headline: GLM-5.3-Flash at $8.50 scores 42, above DeepSeek-V4.1-Flash at $18
    body: Unchanged prices; the ordering is what moved. Qwen3.8-27B was repriced on OpenRouter to $0.10/$1.80, $13 for the job, but the leaderboard now reads 22 where Issue 02 printed 34, and 45 for Qwen3.8-Max where it printed 40. Unverified why.
    changed: The cheapest row is no longer the weakest, and open-model scores moved without a version change.
    change: Re-read the scores the day you decide, and store the read date beside the model choice in your validation file.
    link: longform
  signal: An index can shift under a fixed version label. A model decision needs the score, the date read and the price expiry as one record.
- key: papers
  num: '07'
  label: PAPERS TO IMPLEMENTATION
  title: Runs, Traces and Who Checks Them
  intro: Three results on repeatability, trace-level policy and audit independence. Each is a claim; each note is the build change.
  accent: A78BFA
  items:
  - kicker: MEDAGENTBENCH · 2609.13582
    headline: 43 of 43 ordering groups write different orders across five identical runs
    body: 1,000 evaluations over 50 tasks. With an 8B model at temperature 0.7 the benchmark score was identical across runs while the actual doses, tests and referrals differed every time.
    changed: A pass rate says nothing about which order the agent writes on a given day.
    change: Add a five-run repeat to your eval and fail it on any difference in emitted orders or arguments, not on the score.
    link: longform
  - kicker: COMPOSITIONAL VIOLATIONS · 2609.18820
    headline: Every step passes its check and the run still breaks the policy
    body: Four named patterns, authority creep, threshold laundering, cumulative sum violation and context collapse, with a provenance-tracking runtime that checks policy over the whole trace. No quantitative results in the abstract.
    changed: A dose limit checked per call is defeated by three calls under the limit.
    change: Keep running totals per patient and per encounter across the trace and check the limit there, not only at the tool.
    link: longform
  - kicker: INDEPENDENCE-GRADED AUDIT · 2609.18272
    headline: An internal audit surfaces 5.9 percent of the faults it could see
    body: Grades audit independence on control, shared technical substrate and attestable evidence, borrowing the beta-factor common-cause model. In simulation a conventional internal audit finds none at all in half the fault classes.
    changed: An auditor built on the agent's own logging stack shares its blind spots.
    change: Write audit evidence to a store the agent cannot write to, read by a stack it does not share.
    link: longform
  signal: Same input, different orders. Legal steps, illegal sum. A shared stack auditing itself. Each needs a test the agent's own logs cannot pass by construction.
mechanism:
  num: 08
  label: MECHANISM OF THE WEEK
  title: The policy that stopped approving arguments it never saw
  kicker: OPENAI AGENTS SDK 0.22.3 · SCRIPTEDMODEL, 0.22.2 AGAINST 0.22.3, NO MODEL KEY
  body: A write tool with a conditional policy, IV or above 1,000 mg needs a clinician. Four scripted calls. On 0.22.2 the policy read the model's JSON while the tool ran the validated values, so an omitted route was written as the default IV and 1.5 g as 1,500 mg, both with no clinician. On 0.22.3 both paused. But the clinician is shown the same raw JSON, no route and 1.5 g, and a tool taking a Pydantic model now pauses on every call, safe or not.
  stats:
  - n: '2'
    label: WRITES THE POLICY MISSED ON 0.22.2
  - n: '0'
    label: UNAPPROVED WRITES ON 0.22.3
  - n: '1 of 2'
    label: SAFE CALLS NOW PAUSED
  changed: The gap moved from the policy to the screen. The SDK hands the decision to a human, and the human sees what the policy used to see.
  move: Render the validated arguments, defaults filled in, on the approval screen, and flatten the arguments of tools that need a conditional policy. test_oa_approval_arguments.py runs both versions in under two minutes.
  link: lab
  signal: The fix is fail-closed and correct. What the approver reads is still yours to build, and it is the line an auditor will ask about.
shipped:
  num: 09
  label: WHAT THE ARCHITECTS SHIPPED
  title: Technical output only, no job moves
  items:
  - who: EPIC
    text: Agent Factory build-a-thon, 25 health systems building refill, critical-care-time and med-reconciliation agents inside Epic. No published audit contract for write-back.
  - who: LANGCHAIN
    text: Included Health's federated agents on Deep Agents and LangGraph, with annotation queues as the clinical oversight layer.
  - who: OPENAI
    text: A framework for reporting model misalignment, including acting without authorisation and concealing information, with six disclosed cases.
  - who: WILLISON
    text: A write-up showing an operator's own logs could not reconstruct what its agents had done to RubyGems in May.
  - who: AIUC
    text: AIUC-1 on Latent Space, an agent certification that insurers price against, with third-party adversarial testing and evidence specifications.
  quiet: Nothing in window from LangGraph or Semantic Kernel releases, HL7, FDA on AI, ONC, NIST, the MCP blog or the Anthropic engineering blog.
  signal: Insurers, a lab and a large EHR vendor all talked about evidence for agent actions this week. None published the record format.
constraints:
  num: '10'
  label: CONSTRAINTS AND RADAR
  title: Contracts and Payment Rules That Set the Evidence Bar
  items:
  - kicker: CMS · ACCESS MODEL
    headline: Medicare will pay on outcomes for AI-enabled chronic care
    body: Announced 15 September for spring 2027, adding heart failure, COPD and substance use disorder, with payment tied to outcomes and access to AI-enabled technologies and remote monitoring named in the release. No data standard is named.
    move: If you build for a participant, design the outcome measurement as an audited pipeline now. The payment depends on it and no standard will tell you its shape.
  - kicker: ANTHROPIC · COMPLIANCE API, MANAGED AGENTS
    headline: Tool inputs in compliance transcripts are capped at 10,000 bytes, kept six years
    body: Compliance transcripts carry tool_use and tool_result with a truncated flag and 10,000-byte defaults, retained six years; the documented fields include no approval record. The Managed Agents overview states it is not eligible for zero-data-retention or BAA coverage.
    move: Keep your own full-fidelity tool log for PHI workflows; a vendor transcript truncated at 10 KB is not the record of a FHIR bundle.
  radar:
    text: Every dated source for this week is in the long-form edition. The cumulative Radar was not refreshed this week.
    link: radar
  signal: A payer rule and a vendor contract each fix what evidence must exist. You decide where it lives.
close:
  text: Full mechanism, code and sources for every card are in the long-form edition. The architect's position on this week's decision is in My Take. The code runs from a clean virtual environment with no API key.

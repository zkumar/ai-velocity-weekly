one_line: Last week a clock and a token audience could decide before the clinician. This week the question moved inside the call itself, to whether a yes is bound to the arguments that run or to the ones the model wrote.
pillars:
- name: BINDING
  text: A policy, a person and a middleware each approve some version of the call. Which version reaches the FHIR server? Slides 04 and 08.
- name: TRANSCRIPT
  text: When a pharmacist edits a dose, the message history and the checkpoint now disagree by design. Which one does your exporter read? Slide 04.
- name: EXPORT
  text: A redaction flag and a strict type were both quietly ignored for weeks. What left the process that you had switched off? Slide 05.

theme:
  label: THE WEEK'S THEME
  title: WHAT THE YES COVERED
  text: Issue 02 asked who may answer before the clinician. This week three frameworks changed which arguments an approval is attached to, and one of them now keeps the proposed call and the executed call in different places.

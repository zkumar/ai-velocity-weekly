theme:
  label: THE WEEK'S THEME
  title: THE SIBLING THAT FAILED
  text: 'Issue 06 read what a paused run believes is still open. This week the unit became the batch: two tool calls in one model response, one of them a write, and what the history keeps about the one that succeeded when the other fails.'

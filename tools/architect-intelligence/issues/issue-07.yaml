one_line: 'Last week a paused run was state that nobody read correctly. This week a batch failed as a unit: an apixaban order written beside a failed allergy lookup vanished from the history, the resume was told it never ran, and the record got a second one.'
pillars:
- name: BATCH
  text: Two calls in one response, one raised, the run ended. Does the return of the call that finished survive in the history you persist, and have you tested that with a cancel as well as a raise? Slide 08.
- name: AUTHORITY
  text: A browser's shared state and, since this morning, a reviewer model can both reach the place approvals are stored. Who is on the write path of your approval store, and does each writer leave a row? Slide 05.
- name: HISTORY
  text: A replayed transcript says a call was interrupted; a compaction ran while a question was open; an invalid answer vanished into the model's turn. What does your resume trust, and what does it check first? Slide 04.
